name: StageTimer
options:
  bundleIdPrefix: dev.bence
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: 2LV8JK59ZV
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "8"
    # PostHog project API key, shared with Line Bites (events carry app=stage-timer).
    # Empty disables analytics entirely.
    POSTHOG_API_KEY: phc_vUgTnULQdUWDrzsoDfGrBoUz59RY3Z3bSQqvdJukkPt4
packages:
  # Pinned: the generated project's Package.resolved is gitignored with it, so a range here would
  # let every archive pick up whatever 3.x came out that morning. Bump on purpose.
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    exactVersion: "3.98.2"
targets:
  StageTimer:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    dependencies:
      - package: PostHog
    # A shared scheme, so `xcodebuild -scheme StageTimer test` runs StageTimerTests.
    scheme:
      testTargets:
        - StageTimerTests
      gatherCoverageData: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.bence.stagetimer
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Stage Screen
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        PostHogAPIKey: $(POSTHOG_API_KEY)
        # The control surface is always dark; a white launch screen is a flash in a dimmed room.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: false
        # "Keep running when locked": a silent audio session keeps the app alive after the top
        # button so the external display keeps counting (Sources/LockKeepalive.swift).
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSUserActivityTypes:
          - dev.bence.stagetimer.display
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Control
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).ControlSceneDelegate
              - UISceneConfigurationName: Display
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).DisplaySceneDelegate
            UIWindowSceneSessionRoleExternalDisplayNonInteractive:
              - UISceneConfigurationName: External
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).DisplaySceneDelegate
  # Hosted in the app (`@testable import StageTimer`) and run on a simulator by `make test`. Every
  # .swift file under Tests/ is picked up. Tests/App needs the app; Tests/Core is also a SwiftPM
  # test target (root Package.swift, `make core`), so its files import whichever module exists.
  StageTimerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: StageTimer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.bence.stagetimer.tests
        GENERATE_INFOPLIST_FILE: YES
