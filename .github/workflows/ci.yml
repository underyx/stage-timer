name: CI

# Compiles and tests every pull request and every push to main. Cloud sessions write most of this
# app and have no Xcode, so this is where a change is first compiled: read the result before merging.
#
# Two jobs. `core` is cheap and runs on Linux. `app` needs a Mac. The repository is public, so
# neither bills any minutes; a change that only touches Markdown still starts no run, and a newer
# push to the same pull request still cancels the run before it, because a Mac takes a while to get.
#
# Public also means anyone can open a pull request from a fork. Such a run gets no secrets and a
# read-only token, and waits for the owner's approval (repository setting). Keep it that way: no
# `pull_request_target`, and no self-hosted runner on this repository, which a fork's pull request
# could aim its own copy of this file at.
on:
  pull_request:
    paths-ignore: ["**.md"]
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # The timer logic that has no UIKit in it, as a SwiftPM package: no simulator, no Mac. There is
  # nothing to run until a root Package.swift exists, and the job then says so and passes.
  core:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.4
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: swift test
        run: |
          if [ ! -f Package.swift ]; then
            echo "::notice::No Package.swift yet: nothing for SwiftPM to test"
            exit 0
          fi
          swift --version
          swift test

  app:
    name: App build and tests (Xcode)
    # vars.IOS_RUNS_ON is JSON: "xcode-27" (GitHub's image with Xcode 27, the default; macos-26 has
    # only Xcode 26, which can't compile the app). Not the labels of a self-hosted Mac while the
    # repository is public: see the top of this file.
    runs-on: ${{ fromJSON(vars.IOS_RUNS_ON || '"xcode-27"') }}
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        env:
          XCODE_APP: ${{ vars.XCODE_APP }}
        run: scripts/select-xcode.sh

      - name: Install XcodeGen
        env:
          HOSTED: ${{ runner.environment == 'github-hosted' }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_ANALYTICS: "1"
          HOMEBREW_NO_ENV_HINTS: "1"
        run: |
          if ! command -v xcodegen >/dev/null; then
            if [ "$HOSTED" = true ]; then
              brew install xcodegen
            else
              # Nothing gets installed on the owner's Mac behind his back.
              echo "::error::xcodegen isn't on the self-hosted runner's PATH (brew install xcodegen)"
              exit 1
            fi
          fi
          xcodegen --version

      # The TestFlight workflow's profile script, against a fake App Store Connect: a second.
      - name: Test the release scripts
        run: python3 scripts/ci/test_asc_profiles.py

      # Debug, on a simulator: the app launches as the test host, then Tests/ runs inside it.
      - name: Test on a simulator
        run: make test

      # What an archive compiles: Release, for a device. `#if DEBUG` code and simulator-only
      # availability can hide an error from the step above.
      - name: Build Release for a device
        run: make build

      # Tests/App/ScreenshotTests.swift draws the real views into this folder during `make test`.
      # Kept even when a step above failed: a picture is often the fastest way to see why.
      - name: Keep the screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: screenshots
          path: build/screenshots
          if-no-files-found: ignore
          retention-days: 14
