name: iOS TestFlight
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run
  && format('TestFlight release ({0})', github.ref_name)
  || format('TestFlight dry run ({0})', github.head_ref || github.ref_name) }}

# Archives the app, signs it for the App Store and uploads it to App Store Connect, with no Mac
# involved: the same result as `make upload` on the laptop. CLAUDE.md › "Releasing" has the steps.
#
# Run by hand with dry_run off, on main, it releases the version and build that project.yml names,
# refuses a build whose tag v<version>-<build> exists, and pushes that tag after the upload.
# Run by hand with dry_run on (the default), or by a pull request that changes this workflow or
# scripts/ci, it archives, signs and exports an .ipa and checks it: no upload, no tag, and the
# App Store Connect key is never written to disk.
#
# A tag push starts nothing: tags are this workflow's (and `make upload`'s) record, not a trigger.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (archive, sign and export an .ipa; don't upload)
        type: boolean
        default: true
  pull_request:
    paths:
      - .github/workflows/ios-testflight.yml
      - scripts/ci/**

permissions:
  contents: read

# One release at a time, and a running one is never cancelled. Dry runs queue per branch, apart
# from releases, so one can't displace a waiting release.
concurrency:
  group: >-
    ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run && 'ios-testflight'
    || format('ios-testflight-dry-run-{0}', github.head_ref || github.ref_name) }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  TEAM_ID: 2LV8JK59ZV
  BUNDLE_ID: dev.bence.stagetimer
  EXPORT_OPTIONS: scripts/ci/ExportOptions.plist  # the profile name, by bundle ID
  DRY_RUN: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run }}

jobs:
  release:
    name: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run && 'Release' || 'Dry run' }}
    # vars.IOS_RUNS_ON is JSON: "xcode-27" (GitHub's image with Xcode 27, the default) or the labels
    # of a self-hosted Mac, which signs with the identity in its login keychain instead.
    runs-on: ${{ fromJSON(vars.IOS_RUNS_ON || '"xcode-27"') }}
    timeout-minutes: 45
    permissions:
      contents: write  # the release pushes the tag v<version>-<build>
    env:
      ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check the configuration
        env:
          HOSTED: ${{ runner.environment == 'github-hosted' }}
          HAS_ASC_KEY: ${{ secrets.ASC_API_KEY_P8 != '' }}
          HAS_DIST_P12: ${{ secrets.DIST_P12_BASE64 != '' && secrets.DIST_P12_PASSWORD != '' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          ok=true
          setup="in a checkout of underyx/life: ios/scripts/setup-release.sh --hosted --repo $GITHUB_REPOSITORY"
          [ "$HAS_ASC_KEY" = true ] || { echo "::error::Secret ASC_API_KEY_P8 isn't set. One-time setup at the Mac, $setup"; ok=false; }
          [[ $ASC_KEY_ID =~ ^[A-Z0-9]{8,}$ ]] || { echo "::error::Variable ASC_KEY_ID is missing or malformed"; ok=false; }
          [[ $ASC_ISSUER_ID =~ ^[0-9a-f-]{36}$ ]] || { echo "::error::Variable ASC_ISSUER_ID is missing or malformed"; ok=false; }
          if [ "$HOSTED" = true ] && [ "$HAS_DIST_P12" != true ]; then
            echo "::error::On GitHub's runners the job signs with the certificate in DIST_P12_BASE64 and DIST_P12_PASSWORD, which aren't set. One-time setup at the Mac, $setup"
            ok=false
          fi
          if [ "$DRY_RUN" != true ] && [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Only $DEFAULT_BRANCH releases: merge first, or run this branch as a dry run"
            ok=false
          fi
          $ok

      # project.yml is the one place the version and build are written; the Makefile reads them.
      - name: Work out the version and build number
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(make -s print-VERSION)
          build=$(make -s print-BUILD)
          tag=$(make -s print-TAG)
          [[ $version =~ ^[0-9]+(\.[0-9]+){0,2}$ && $build =~ ^[0-9]+$ ]] ||
            { echo "::error::project.yml gives version '$version' and build '$build'"; exit 1; }
          {
            echo "marketing=$version"
            echo "build=$build"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
          echo "Stage Screen $version ($build), tag $tag"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            if [ "$DRY_RUN" = true ]; then
              echo "::notice::The tag $tag exists: build $build was already uploaded. Fine for a dry run; a release needs a higher CURRENT_PROJECT_VERSION."
            else
              echo "::error::The tag $tag exists, so build $build was already uploaded. Raise CURRENT_PROJECT_VERSION in project.yml."
              exit 1
            fi
          fi

      - name: Select Xcode
        id: xcode
        env:
          XCODE_APP: ${{ vars.XCODE_APP }}
        run: scripts/select-xcode.sh

      - name: Generate the Xcode project
        env:
          HOSTED: ${{ runner.environment == 'github-hosted' }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_ANALYTICS: "1"
          HOMEBREW_NO_ENV_HINTS: "1"
        run: |
          if ! command -v xcodegen >/dev/null; then
            if [ "$HOSTED" = true ]; then
              brew install xcodegen
            else
              # Nothing gets installed on the owner's Mac behind his back.
              echo "::error::xcodegen isn't on the self-hosted runner's PATH (brew install xcodegen)"
              exit 1
            fi
          fi
          xcodegen --version
          make gen

      # GitHub-hosted only. On a self-hosted runner the identity is already in the owner's login
      # keychain, and nothing here touches his keychains or their search list.
      # `security` takes the .p12 password and the temporary keychain's password only as arguments,
      # so `ps` on this single-job, throwaway VM can see them (never the log: both are masked). The
      # .p12 is only in env and a pipe. Same step as underyx/life's ios-testflight.yml.
      - name: Import the distribution certificate
        id: keychain
        if: runner.environment == 'github-hosted'
        env:
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release-signing.keychain-db"
          echo "path=$keychain" >> "$GITHUB_OUTPUT"
          password=$(openssl rand -hex 32)
          echo "::add-mask::$password"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          # From the secret straight into the keychain: the .p12 is never a file.
          printf '%s' "$DIST_P12_BASE64" | base64 --decode |
            security import /dev/stdin -k "$keychain" -f pkcs12 -P "$DIST_P12_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          keychains=("$keychain")
          while IFS= read -r k; do
            k=${k#"${k%%[![:space:]]*}"}
            keychains+=("${k//\"/}")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${keychains[@]}"
          valid() { security find-identity -v -p codesigning "$keychain" | grep -c "Apple Distribution: .*($TEAM_ID)" || true; }
          if [ "$(valid)" -lt 1 ] && security find-identity -p codesigning "$keychain" | grep -q 'Apple Distribution'; then
            # There, but not trusted: the image lacks the intermediate that issued it (WWDR G3).
            echo "Adding Apple's WWDR G3 intermediate certificate"
            wwdr="$RUNNER_TEMP/AppleWWDRCAG3.cer" # public; security import goes by the extension
            curl -fsSL -o "$wwdr" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
            security import "$wwdr" -k "$keychain" >/dev/null
          fi
          count=$(valid)
          echo "Imported $count Apple Distribution identity(ies) for $TEAM_ID"
          [ "$count" -ge 1 ] || { echo "::error::DIST_P12_BASE64 holds no valid Apple Distribution identity for $TEAM_ID"; exit 1; }

      # Finds (or makes) the App Store profile ExportOptions.plist names, for the certificate this
      # job can sign with, and installs it. The key can't use cloud-managed signing, so this is how.
      - name: Install the provisioning profile
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          KEYCHAIN: ${{ steps.keychain.outputs.path }}
        run: python3 scripts/ci/asc_profiles.py --export-options "$EXPORT_OPTIONS" ${KEYCHAIN:+--keychain "$KEYCHAIN"}

      # Signed here, not only at export. The signing settings go on the xcodebuild line, which
      # reaches every target, the PostHog package's included: so the profile is named through
      # STAGE_PROFILE_<bundle ID as an identifier>, which resolves to nothing for any other target
      # (a package target given a profile fails with "does not support provisioning profiles").
      - name: Archive
        timeout-minutes: 30
        env:
          MARKETING_VERSION: ${{ steps.version.outputs.marketing }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
        run: |
          archive="$RUNNER_TEMP/StageTimer.xcarchive"
          profiles=()
          while IFS=$'\t' read -r bundle name; do
            profiles+=("STAGE_PROFILE_${bundle//[^A-Za-z0-9_]/_}=$name")
          done < <(plutil -extract provisioningProfiles json -o - "$EXPORT_OPTIONS" |
            python3 -c 'import json, sys; [print(f"{k}\t{v}") for k, v in json.load(sys.stdin).items()]')
          printf 'Profile: %s\n' "${profiles[@]}"
          # shellcheck disable=SC2016 # $(…) is an Xcode build-setting macro, for xcodebuild to expand
          xcodebuild archive \
            -project StageTimer.xcodeproj \
            -scheme StageTimer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            'PROVISIONING_PROFILE_SPECIFIER=$(STAGE_PROFILE_$(PRODUCT_BUNDLE_IDENTIFIER:identifier))' \
            "${profiles[@]}" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | if command -v xcbeautify >/dev/null; then xcbeautify --renderer github-actions; else cat; fi
          app="$archive/Products/Applications/StageTimer.app"
          got="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist") ($(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist"))"
          echo "Archived $got"
          if [ "$got" != "$MARKETING_VERSION ($BUILD_NUMBER)" ]; then
            echo "::error::The archive is $got, not $MARKETING_VERSION ($BUILD_NUMBER)"
            exit 1
          fi
          python3 scripts/ci/check_signature.py --team "$TEAM_ID" --bundle-id "$BUNDLE_ID" "$app"

      - name: ${{ env.DRY_RUN == 'true' && 'Export (dry run, no upload)' || 'Export and upload to App Store Connect' }}
        timeout-minutes: 30
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          options="$RUNNER_TEMP/ExportOptions.plist"
          cp "$EXPORT_OPTIONS" "$options"
          auth=()
          if [ "$DRY_RUN" = true ]; then
            # Manual signing needs no account: a dry run never writes the key anywhere.
            plutil -replace destination -string export "$options"
          else
            # xcodebuild takes the key only as a regular file (a pipe or /dev/fd fails with EACCES,
            # underyx/life 2026-09-26). It exists for this one command, in a private folder that the
            # trap removes, and the last step removes it again if this step is killed.
            umask 077
            key_dir=$(mktemp -d "$RUNNER_TEMP/asc-key.XXXXXX")
            chmod 700 "$key_dir"
            trap 'rm -rf "$key_dir"' EXIT
            key="$key_dir/AuthKey_$ASC_KEY_ID.p8"
            printf '%s\n' "$ASC_API_KEY_P8" > "$key"
            chmod 600 "$key"
            # With manual signing -allowProvisioningUpdates can only fetch the named profile, which
            # is already installed.
            auth=(-allowProvisioningUpdates -authenticationKeyPath "$key"
              -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          fi
          status=0
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/StageTimer.xcarchive" \
            -exportOptionsPlist "$options" \
            -exportPath "$RUNNER_TEMP/export" \
            "${auth[@]}" 2>&1 | tee "$RUNNER_TEMP/export.log" || status=$?
          if [ "$status" -ne 0 ]; then
            # Signing and upload failures are explained in the distribution logs, not on stdout.
            logs=$(sed -nE 's/.*Created bundle at path "(.*\.xcdistributionlogs)".*/\1/p' "$RUNNER_TEMP/export.log" | tail -n 1)
            if [ -n "$logs" ] && [ -f "$logs/IDEDistribution.standard.log" ]; then
              echo "::group::IDEDistribution.standard.log (last 150 lines)"
              tail -n 150 "$logs/IDEDistribution.standard.log"
              echo "::endgroup::"
            fi
            exit "$status"
          fi

      - name: Check the exported app (dry run)
        if: env.DRY_RUN == 'true'
        run: |
          ipa=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' | head -n 1)
          [ -n "$ipa" ] || { echo "::error::The export made no .ipa"; exit 1; }
          unzipped="$RUNNER_TEMP/ipa"
          rm -rf "$unzipped"
          unzip -q "$ipa" -d "$unzipped"
          python3 scripts/ci/check_signature.py --team "$TEAM_ID" --bundle-id "$BUNDLE_ID" "$unzipped/Payload/StageTimer.app"
          echo "$(du -h "$ipa" | cut -f1) $(basename "$ipa")"

      # The record of which commit a build was, and what stops the same build number going up
      # twice (here and in `make upload`). A tag pushed with this token starts no workflow.
      - name: Tag the uploaded commit
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA" >/dev/null
          echo "Tagged $GITHUB_SHA as $TAG"

      - name: Summary
        env:
          MARKETING_VERSION: ${{ steps.version.outputs.marketing }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
          TAG: ${{ steps.version.outputs.tag }}
          XCODE_VERSION: ${{ steps.xcode.outputs.version }}
          XCODE_BUILD: ${{ steps.xcode.outputs.build }}
        run: |
          {
            if [ "$DRY_RUN" = true ]; then
              echo "## Dry run: nothing uploaded"
              echo
              echo "Archived, signed and exported Stage Screen $MARKETING_VERSION ($BUILD_NUMBER) with Xcode $XCODE_VERSION ($XCODE_BUILD) on $RUNNER_NAME."
            else
              echo "## Uploaded Stage Screen $MARKETING_VERSION ($BUILD_NUMBER)"
              echo
              echo "Built with Xcode $XCODE_VERSION ($XCODE_BUILD) on $RUNNER_NAME from ${GITHUB_SHA:0:7}, now tagged $TAG. It appears in TestFlight once App Store Connect has processed it."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the key and signing material
        if: always()
        env:
          KEYCHAIN: ${{ steps.keychain.outputs.path }}
        run: |
          rm -rf "$RUNNER_TEMP"/asc-key.*
          if [ -n "$KEYCHAIN" ]; then security delete-keychain "$KEYCHAIN" || true; fi
          rm -rf "$RUNNER_TEMP/StageTimer.xcarchive" "$RUNNER_TEMP/export" "$RUNNER_TEMP/ipa" "$RUNNER_TEMP/DerivedData"
